# To reject pushes when tests fail, enable branch protection on main/test in GitHub:
# Settings → Branches → Add rule → require status checks → select this workflow's job name ("test").
# Once configured, GitHub will block merges to those branches if this workflow does not pass.

name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: src
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run test suite
        working-directory: src
        run: pytest test/ -v
